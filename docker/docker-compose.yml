version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dispatch_dev
      POSTGRES_USER: dispatch
      POSTGRES_PASSWORD: dispatch_secret
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispatch"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    hostname: mail
    domainname: dispatch.local
    environment:
      - ENABLE_SPAMASSASSIN=0
      - ENABLE_CLAMAV=0
      - ENABLE_FAIL2BAN=0
      - SSL_TYPE=self-signed
      - POSTMASTER_ADDRESS=postmaster@dispatch.local
      - PERMIT_DOCKER=network
      - LOG_LEVEL=debug
    ports:
      - "25:25"
      - "143:143"
      - "587:587"
      - "993:993"
    volumes:
      - ./mailserver/data:/var/mail
      - ./mailserver/config:/tmp/docker-mailserver
    cap_add:
      - NET_ADMIN

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://dispatch:dispatch_secret@postgres/dispatch_dev
      REDIS_URL: redis://redis:6379
      MAIL_HOST: mailserver
      MAIL_DOMAIN: dispatch.local
      RAILS_ENV: development
      SECRET_KEY_BASE: dev_secret_key_base_change_in_production_32chars_min
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ../backend:/app
      - bundle_cache:/usr/local/bundle

  sidekiq:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: bundle exec sidekiq -C config/sidekiq.yml
    environment:
      DATABASE_URL: postgresql://dispatch:dispatch_secret@postgres/dispatch_dev
      REDIS_URL: redis://redis:6379
      RAILS_ENV: development
      SECRET_KEY_BASE: dev_secret_key_base_change_in_production_32chars_min
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ../backend:/app
      - bundle_cache:/usr/local/bundle

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
    volumes:
      - ../frontend:/app
      - /app/node_modules

volumes:
  pg_data:
  bundle_cache:
